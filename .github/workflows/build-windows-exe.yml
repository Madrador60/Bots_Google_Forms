name: Build Windows EXE

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GoogleFormStudio
          --icon assets/app-icon.ico
          --add-data "assets;assets"
          --paths app
          --distpath dist
          --workpath build
          app/Interface_GoogleForm_Studio.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GoogleFormStudio-Windows
          path: dist/GoogleFormStudio.exe

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Google Form Studio v1.0.0
          body: |
            # Google Form Studio v1.0.0

            Version Windows prête à utiliser sans installer Python.

            ## Télécharger

            Cliquez sur `GoogleFormStudio.exe` dans les fichiers ci-dessous.

            ## Nouveautés

            - Application Windows empaquetée en `.exe`.
            - Icône personnalisée.
            - Historique local par machine.
            - Installation, mise à jour et désinstallation depuis `googleform`.

            Téléchargement direct :
            https://github.com/Madrador60/Bots_Google_Forms/releases/latest/download/GoogleFormStudio.exe
          files: dist/GoogleFormStudio.exe
          prerelease: false
          make_latest: true
