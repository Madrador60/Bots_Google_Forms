name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name GoogleFormStudio
          --paths app
          --distpath dist
          --workpath build
          app/Interface_GoogleForm_Studio.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GoogleFormStudio-Windows
          path: dist/GoogleFormStudio.exe
